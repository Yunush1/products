<body>

  <div class="categories">

    <button onclick="filterCategory('electronics')">Electronics</button>
    <button onclick="filterCategory('clothing')">Clothing</button>
    <button onclick="filterCategory('books')">Books</button>
  </div>

  <div class="products" id="productList">
    <!-- Products will be injected here -->
  </div>

  <script>


    function debounce(query){
        searchProducts(query);
    }

  let allProducts = [];

  async function fetchProducts() {
    const query = `
      query {
        products {
          id
          name
          category
          image
          price
        }
      }
    `;

    try {
      const response = await fetch("http://localhost:4000/graphql", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });

      const result = await response.json();
      allProducts = result.data.products || [];
      displayProducts(allProducts);
    } catch (error) {
      console.error("Error fetching products:", error);
    }
  }

  function displayProducts(productArray) {
    const container = document.getElementById('productList');
    container.innerHTML = '';
    productArray.forEach(product => {
      const div = document.createElement('div');
      div.className = 'product';
      div.innerHTML = `
        <img src="${product.image}" alt="${product.name}" />
        <h3>${product.name}</h3>
        <p>${product.price}</p>
      `;
      container.appendChild(div);
    });
  }

  function filterProducts() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allProducts.filter(p => p.name.toLowerCase().includes(search));
    displayProducts(filtered);
  }

  function filterCategory(category) {
    if (category === 'all') return displayProducts(allProducts);
    const filtered = allProducts.filter(p => p.category === category);
    displayProducts(filtered);
  }
  async function searchProducts(query) {
     const query = `
      query {
        products(name: "${query}") {
          id
          name
          category
          image
          price
        }
      }
    `;

    try {
      const response = await fetch("http://localhost:4000/graphql", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });

      const result = await response.json();
      allProducts = result.data.products || [];
      displayProducts(allProducts);
    } catch (error) {
      console.error("Error fetching products:", error);
    }   
  }
  // Initial load
  fetchProducts();
</script>
